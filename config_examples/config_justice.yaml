# Path to the .env file. Loaded at the very top of Config.load, so any
# ${VAR} reference further down in this file is resolved against it.
env: /home/benjaminpillot/Documents/PRO/ENERGY_TRANSITION_&_JUSTICE_MODEL/.env

bib:
  # WoS source: either a local file (source: file) or the Expanded API
  # (source: api). Pick one. Switch to `source: api` once your API key
  # is active and update the query below.
  wos:
    source:        # disabled for this OpenAlex-only test — set to 'file' (or 'api') to re-enable WoS
#    file: /home/benjaminpillot/Documents/PRO/ABM_LITERATURE_REVIEW/WoS/WITH_REFS/MAY_2026/savedrecs_all.bib
    file: /home/benjaminpillot/Documents/PRO/ENERGY_TRANSITION_&_JUSTICE_MODEL/REVIEW/WOS/savedrecs_all.bib
    api:
      api_key: #${WOS_API_KEY}                                # resolved from .env
      query:
      cache_dir: /home/benjaminpillot/Documents/PRO/ABM_LITERATURE_REVIEW/WoS/cache
  open_alex:
    source: api    # 'file' or 'api' or leave blank if not to be included
    file: /home/benjaminpillot/Documents/PRO/ABM_LITERATURE_REVIEW/OpenAlex/DECEMBER_2025/open_alex.csv
    api:
      api_key: ${OPENALEX_API_KEY}
      email: ${OPENALEX_EMAIL}                                # optional, polite-pool credit
      # Narrowed set (~546 works): justice embedded in energy models. The search
      # covers title+abstract only (not full text); AND/OR/"quotes" are honoured.
      query: energy transition AND model AND justice
      filters:                                                # structured filters (combined with AND)
        publication_year: '2016-2026'                         # aligns with extract.year below
        type: article
      cache_dir: /home/benjaminpillot/Documents/PRO/ENERGY_TRANSITION_&_JUSTICE_MODEL/PYSYREV/OpenAlex_cache
  scopus:
  pubmed:

  # --- Abstract completion (opt-in, corpus-level) ---
  # OpenAlex leaves a share of records without an abstract, and no-abstract rows
  # are dropped by cleaning — recovering them from WoS (looked up by DOI) is
  # useful even in this OpenAlex-only run since abstracts feed the topic model.
  # Runs on the merged corpus before the drop; only the abstract is filled, the
  # referenced_works IDs used for coupling stay intact. Uncomment to activate.
  # abstract_completion:
  #   - provider: wos
  #     api_key: ${WOS_API_KEY}
  #     cache_dir: /home/benjaminpillot/Documents/PRO/ENERGY_TRANSITION_&_JUSTICE_MODEL/PYSYREV/wos_completion_cache

  # --- Merge parameters (duplicates removal across sources) ---
  # merge:
  #   title_similarity: 98         # fuzzy similarity threshold (0-100) for duplicate detection
  #   ngram_size: 3                # word n-gram size for the blocking index
  #   max_candidates_per_row: 200  # max candidates per query in the blocking phase
  #   scorer: token_set_ratio      # rapidfuzz scorer: token_set_ratio | partial_token_sort_ratio | WRatio | partial_ratio | ratio
  #   priority: [open_alex, wos, scopus, pubmed]  # dedup priority, most-important first.
  #                                # First configured source wins duplicates and keeps its IDs
  #                                # (default keeps OpenAlex first); list wos first for the old behaviour.

  # --- Canonical reference keys (optional; presence enables it) ---
  # Remap references onto a shared DOI key space so bibliographic coupling holds
  # across merged sources regardless of merge order. Intra-corpus and DOI-bearing
  # refs map for free; extra-corpus OpenAlex ids are resolved via the OpenAlex API
  # (creds reused from open_alex.api) and cached. The API step is skipped
  # automatically when there is no other-source DOI to bridge to (e.g. WoS-only or
  # pure-OpenAlex run), so it is safe to leave enabled.
  # reference_keys:
  #   cache: /home/benjaminpillot/Documents/PRO/ENERGY_TRANSITION_&_JUSTICE_MODEL/PYSYREV/openalex_doi_cache.csv
  #   resolve_external: true       # false = offline only (no API calls)

  # --- Cleaning parameters ---
  # clean:
  #   min_signals_to_reject: 2     # min number of garbage signals to drop an abstract
  #   extra_garbage_phrases: []    # additional phrases to flag as garbage
  #   use_langdetect: false        # use langdetect library for language detection

  # --- Extraction / filtering parameters ---
  extract:
    include_doc_type: [article, review]  # leave empty to keep all document types
    exclude_doc_type: [peer review]      # types to remove (fuzzy); takes priority over include_doc_type
    year: 2016                     # min publication year (inclusive)
  #   nb_citations: 0              # min citation count (inclusive)
    language: english              # str, list of str, or null/empty (default: null = keep all languages)
  #   scorer: partial_token_sort_ratio
  #   score_cutoff: 90             # min fuzzy match score (0-100)

  # --- Reference resolution (opt-in, expensive) ---
  resolve_references:
     enabled: true
     flag_unresolved: true
  #   fuzzy_score_cutoff: 90
  #   ngram_size: 3
  #   max_candidates: 50
  #   scorer: token_set_ratio

  # --- Output ---
  # Each run is stored in its own sub-directory under export_dir.
  # The review section will automatically pick up the most recent run.
  export:
    export_dir: /home/benjaminpillot/Documents/PRO/ENERGY_TRANSITION_&_JUSTICE_MODEL/PYSYREV/BIB_RESULTS/
    run_name:   # leave blank for auto-timestamp, or set e.g. "may_2026_wos_oa"


review: # LLM-based review
  #
  # doc_dataset: leave blank to auto-detect the most recent bib run in bib.export.export_dir.
  doc_dataset:
  # Each review run is stored in its own sub-directory under export_dir.
  # Downstream sections (bib_network, topic_model) auto-detect the most recent run.
  export:
    export_dir: /home/benjaminpillot/Documents/PRO/ENERGY_TRANSITION_&_JUSTICE_MODEL/PYSYREV/AI_REVIEW_RESULTS/
    run_name:   # leave blank for auto-timestamp, or set e.g. "test_run_1"
    cache_dir:  # leave blank to place inside the run directory
  batch_size : 50
  api_pause : 30  # time.sleep(api_pause) in order to limit nb of API requests per min during reviewing process
  max_retries : 2              # Max retries on API error, for all reviewers. Overridable per reviewer.
  max_concurrent_requests : 10  # Max simultaneous API calls for all reviewers.
                                # Keep low for Anthropic (5-10); null = default (10). 30 is possible for OpenAI.
                                # Overridable per reviewer.
  items_per_call : 30           # Articles sent per API call. Higher values reduce the number of calls
                                # (backstory sent once per batch). Overridable per reviewer.
  text_inputs : [title, abstract, keywords]
#  input_description : article title/abstract/keywords
  inclusion_criteria : The scope of the study MUST include
                       the integration of justice aspects within
                       models or modeling approaches 
                       FOR addressing energy transition issues.
  exclusion_criteria : 1. The scope of the study DOES NOT include
                      energy transition issues;
                      2. The scope of the study DOES NOT include models
                      or modeling approaches
                      3. The scope of the study DOES NOT include justice aspects
  sample_size :     # Leave blank if the whole dataset must be processed. Otherwise,
                    # size of the corresponding random sample to withdraw from the dataset
  decision_rule : majority   # majority, mean
  workflow :    # Workflow consists in as many rounds as defined by the
                # user. Apart the first round, all rounds apply if and only
                # if consensus has not been reached in the previous one
                # (whatever the decision rule selected)
    - round : A
      reviewers : [Reviewer#1, Reviewer#2]  # Reviewer names defined below

    - round : B
      reviewers : [Reviewer#3]

  reviewers :
    - name : Reviewer#1
      reasoning : brief  # brief, cot (see LatteReview)
      model_id : claude-haiku-4-5  # Model identifier
      host :
      provider : anthropic  # values : litellm, open-ai, ollama, anthropic
      max_tokens : 200
      temperature : 0.65  # temperature parameter is not available for all models
      reasoning_effort :
      max_retries :                # Leave blank to use the section-level value above.
      max_concurrent_requests :    # Leave blank to use the section-level value above.
      backstory : Reviewer#1 is a research scientist with strong expertise
                  in Energy System Modelling for addressing issues related
                  to Energy Transition and net-zero scenarios. Reviewer#1
                  specializes in modeling and analyzing complex energy
                  systems, including renewable integration, grid optimization,
                  demand forecasting, energy policy analysis, and
                  techno-economic assessments. A major focus of Reviewer#1 is
                  literature synthesis and literature reviews — it excels at
                  identifying key themes, comparing methodologies, summarizing
                  findings, and highlighting research gaps in energy systems
                  modeling. Reviewer#1 is highly rigorous  and cautious in its
                  analysis of input texts and articles. It performs thorough and
                  contextualized evaluations of abstracts and full papers,
                  ensuring interpretations are grounded in the methodologies,
                  assumptions, and scope presented by the original authors.
                  It avoids oversimplified generalizations and remains critical
                  of speculative claims or poorly substantiated conclusions.
      additional_context :

    - name : Reviewer#2
      reasoning : brief
      model_id : claude-haiku-4-5
      host :
      provider : anthropic
      max_tokens : 200
      temperature : 0.15
      reasoning_effort :
      backstory : Reviewer#2 is a seasoned researcher with a PhD in social
                  sciences, specializing in social sciences for energy research.
                  Reviewer#2 is an international expert on climate change, 
                  sustainability and just transition public policy issues. His 
                  work all has a principal focus on achieving a sustainable and 
                  just transition to a low-carbon economy, and combines a mix of 
                  governance, management, policy and economics. His work is based
                  around 5 key energy justice principles, i.e. distributive, procedural,
                  restorative, recognition and cosmopolitan. His work on energy 
                  justice has feature in the world’s top journals such as Nature, 
                  Nature Energy, Renewable and Sustainable Energy Reviews, 
                  Energy Policy, Applied Energy and many more. He has presented his
                  work on energy justice across the world, has written policy 
                  documents, held conferences and contributed to project 
                  development in different countries across the world.
                  It also assists with writing and reviewing research papers, 
                  grant proposals, and academic presentations involving energy 
                  justice. Reviewer#2 is collaborative, exploratory, and
                  methodical in its reasoning. It ensures technical accuracy while
                  maintaining a tone that invites discussion, experimentation, and
                  iteration. Reviewer#2 shares relevant methodologies and frameworks
                  but remains open to alternative approaches and creative exploration.
                  It avoids rigid judgment, encourages open-ended inquiry, and flags 
                  assumptions that require clarification or validation.
      additional_context :

    - name : Reviewer#3
      reasoning :
      model_id : claude-sonnet-4-5 # gpt-4o-mini
      host :
      provider : anthropic
      max_tokens : 200
      temperature :
      reasoning_effort : medium
      backstory : Reviewer#3 is a senior MD-PhD researcher with years of experience
                  in conducting systematic reviews in social-ecological systems,
                  Sustainability Science and decarbonisation of the economy. A major
                  focus of Reviewer#3 is literature synthesis and literature reviews —
                  it excels at identifying key themes, comparing methodologies,
                  summarizing findings, and highlighting research gaps in social-ecological
                  studies. Reviewer#3 is highly rigorous and cautious in its analysis of
                  input texts and articles. It performs thorough and contextualized
                  evaluations of abstracts and full papers, ensuring interpretations
                  are grounded in the methodologies, assumptions, and scope presented
                  by the original authors.
      additional_context : Two PhD reviewers have already reviewed this article and
                           disagree on how to evaluate it. You can read their evaluation above.


# NOTE: the standalone `bib_network` stage has been removed. Bibliographic
# coupling, co-citation and topic-connectivity networks are now computed
# report-side from the reviewed corpus' references and rendered directly in the
# report — see topic_report.sections.bib_network below.


topic_model:
  # doc_dataset: leave blank to auto-detect the most recent review run.
  # Set an explicit path to target a specific run or an external CSV.
  doc_dataset:  # ~/Documents/PRO/ABM_LITERATURE_REVIEW/NOTEBOOKS/merged_wos_openalex_with_abstract_no_duplicate.csv
  export:
    export_dir: /home/benjaminpillot/Documents/PRO/ENERGY_TRANSITION_&_JUSTICE_MODEL/PYSYREV/TOPIC_MODELING/
    run_name:   # leave blank for auto-timestamp
  # Distance : euclidean, chebyshev ; default = euclidean
  distance: chebyshev

  # ----

  # ---- Coherence scorer -----------------------------
  # Dict of 2 scorers among: c_v, c_npmi, u_mass
  #   * 1st scorer ('ranking') is used to rank the
  #     best configs among all configs (slower part
  #     of the code)
  #   * 2nd one ('purity') is used to compute
  #     purity of the best ranked configurations
  # Recommendation: use the quickest one for ranking,
  # and the slowest one for computing final purity
  # default : {'ranking' : 'u_mass', 'purity' : 'c_v'}
#  coherence_scorer :
#    ranking : u_mass
#    purity : c_v

  # Keep n results : keep N best results among all
  # clustering procedures corresponding to n_neighbors,
  # n_components, topic size, and min sample values
  # default = 10
  keep_n_results : 25

# ---- HDBSCAN parameters -------------------------
  hdbscan:
    min_topic_size_range : [4, 52]
    min_sample_range : [2, 20]
    topic_size_step : 4
    min_sample_step : 2
#    cluster_selection_method : leaf
#    metric : euclidean
#    prediction_data : True

# ---- UMAP parameters ----------------------------
  umap:
    n_neighbors : [5, 10, 15]
    n_components : [5, 10, 15]
#    metric : cosine
#    min_dist : 0.0
#    low_memory : False
#    random_state : 42

# ---- Bertopic parameters -------------
# Bertopic parameters (see https://maartengr.github.io/BERTopic/index.html)
#  bertopic:
#    transformer_model : allenai/specter2_base
#    n_gram_range : bigram
#    language : english
#    calculate_probabilities : True

# ---- Berteley parameters --------------
# Berteley preprocess (see https://github.com/lbl-camera/berteley)
#  berteley:
#    allow_abbrev : False

# ---- CTF-IDF parameters ----------------
#  ctfidf:
#    bm25_weighting : True
#    reduce_frequent_words : True

# ---- Topic distribution parameters -----
#  topic_distribution:
#    window : 8
#    stride : 1
#    min_similarity : 0.1
#    batch_size : 1000


# =============================================================================
# topic_report — PDF report generation (optional)
# =============================================================================
# When this section is present, `Pipeline.run()` generates a PDF report after
# the topic-model stage. Leave it out to skip report generation entirely.
#
topic_report:
#   # Directory where the PDF and annex files will be written.
   export_to: /home/benjaminpillot/Documents/PRO/ENERGY_TRANSITION_&_JUSTICE_MODEL/PYSYREV/REPORT/
#
#   # run_dir: leave blank to auto-detect the latest topic_model run.
#   # run_dir: /path/to/TOPIC_MODELING/run_YYYY-MM-DD_HH-MM-SS/
#
#   # ---- PDF metadata (defaults shown) -------------------------------------
#   meta:
#     title:       Bibliographic report — Pysyrev
#     subtitle:
#     author:      Report generated with the pysyrev engine (v0.1)
#     date_format: "%d/%m/%Y"
#     version:     1.0.0
#     summary: >
#       This document has been automatically generated.
#
#   # ---- Section parameters ------------------------------------------------
   sections:
     topics:
       n_repr_docs_per_topic: 5
     # Coupling + co-citation + connectivity panels. Rendered automatically
     # whenever the reviewed corpus carries references (no enable flag). All
     # values below are the defaults — comment the whole block to use them.
     bib_network:
       coupling:                # document × document (Salton + Leiden, coloured by topic)
         resolution: 0.7        # Leiden resolution; higher → more, smaller communities
         min_size: 5            # communities smaller than this fall into the uncoupled tail
         backbone_k: 3          # draw only each node's k strongest couplings
         color_by: topic        # topic | community
         hulls: true            # outline Leiden communities when colouring by topic
       cocitation:              # reference × reference (Salton + Leiden)
         min_ref_freq: 2        # keep references cited by at least this many documents
         resolution: 0.7
         min_size: 5
         backbone_k: 3
         color_by: community    # topic | community
         hulls: true
       connectivity:            # mean coupling between groups
         by: topic              # topic | community
         scale: 1000            # rescales the tiny coupling values for readability
#     temporal:
#       variants: [absolute, normalized, weighted]
#     topic_characteristics:
#       n_top_cited_per_topic: 5   # N most-cited papers per topic used for citation impact
#       n_top_cited_global: 50     # N most-cited papers globally used for topic distribution
#     topic_similarity:
#       clustering: true
#       dendrogram: true
     paper_selection:
       min_year: 2020
       proportion_per_topic: 0.15
       selection_by: citations          # citations | random | coupling | co_citation | composite
       # composite = three-axis indicator (coupling centrality + citation
       # relevance + thematic representativeness), ranked per topic. Tune it here:
       # composite:
       #   aggregate: mean          # mean | gmean | chebyshev
       #   weights: [1, 1, 1]       # (centrality, representativeness, relevance); omit for equal
       #   relevance_mode: blend    # blend (cit/yr + raw citations) | cpy (cit/yr alone)
       #   drop_current_year: true  # drop the incomplete current year from the cit/yr denominator
       #   current_year:            # reference year; blank = latest year in the corpus
       export_annex: true
       annex_format: csv


# =============================================================================
# llm — LLM topic labelling (optional)
# =============================================================================
# When present, an LLM generates a human-readable label for each topic.
# Remove or comment out this block to skip LLM labelling.
#
llm:
   provider:   anthropic
   model_id:   claude-haiku-4-5-20251001
   host:
   max_tokens: 200
   temperature: 0.3
   n_repr_docs_for_labeling: 10
