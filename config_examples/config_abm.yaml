# Path to the .env file. Loaded at the very top of Config.load, so any
# ${VAR} reference further down in this file is resolved against it.
env: /home/benjaminpillot/Documents/PRO/ABM_LITERATURE_REVIEW/.env

bib:
  # WoS source: either a local file (source: file) or the Expanded API
  # (source: api). Pick one. Switch to `source: api` once your API key
  # is active and update the query below.
  wos:
    source: file   # 'file' or 'api' or leave blank if not to be included
#    file: /home/benjaminpillot/Documents/PRO/ABM_LITERATURE_REVIEW/WoS/WITH_REFS/MAY_2026/savedrecs_all.bib
    file: /home/benjaminpillot/Documents/PRO/ABM_LITERATURE_REVIEW/WoS/WITH_REFS/MAY_2026/savedrecs_all.bib
    api:
      api_key: #${WOS_API_KEY}                                # resolved from .env
      query: 'ALL = (agent-based (model* OR simulation) AND (energ* OR electric* OR net-zero OR carbon OR renewable OR green OR clean OR transition OR sustainab*)) AND PY=2015-2024'
      cache_dir: /home/benjaminpillot/Documents/PRO/ABM_LITERATURE_REVIEW/WoS/cache
  open_alex:
#    source: file   # 'file' or 'api' or leave blank if not to be included
    source: file
    file: /home/benjaminpillot/Documents/PRO/ABM_LITERATURE_REVIEW/OpenAlex/DECEMBER_2025/open_alex.csv
    api:
      api_key: #${OPENALEX_API_KEY}
      email: #${OPENALEX_EMAIL}                               # optional, polite-pool credit
      query: agent-based energy transition                    # free-text search (BM25 on title+abstract)
      filters:                                                # structured filters (combined with AND)
        publication_year: '2015-2024'
        type: article
      cache_dir: /home/benjaminpillot/Documents/PRO/ABM_LITERATURE_REVIEW/OpenAlex/cache
  scopus:
  pubmed:

  # --- Merge parameters (duplicates removal across sources) ---
  # merge:
  #   title_similarity: 98         # fuzzy similarity threshold (0-100) for duplicate detection
  #   ngram_size: 3                # word n-gram size for the blocking index
  #   max_candidates_per_row: 200  # max candidates per query in the blocking phase
  #   scorer: token_set_ratio      # rapidfuzz scorer: token_set_ratio | partial_token_sort_ratio | WRatio | partial_ratio | ratio

  # --- Cleaning parameters ---
  # clean:
  #   min_signals_to_reject: 2     # min number of garbage signals to drop an abstract
  #   extra_garbage_phrases: []    # additional phrases to flag as garbage
  #   use_langdetect: false        # use langdetect library for language detection

  # --- Extraction / filtering parameters ---
  extract:
    include_doc_type: [article, review]  # leave empty to keep all document types
    exclude_doc_type: [peer review]      # types to remove (fuzzy); takes priority over include_doc_type
    year: 2020                   # min publication year (inclusive)
  #   nb_citations: 0              # min citation count (inclusive)
    language: english              # str, list of str, or null/empty (default: null = keep all languages)
  #   scorer: partial_token_sort_ratio
  #   score_cutoff: 90             # min fuzzy match score (0-100)

  # --- Reference resolution (opt-in, expensive) ---
  resolve_references:
     enabled: true
     flag_unresolved: true
  #   fuzzy_score_cutoff: 90
  #   ngram_size: 3
  #   max_candidates: 50
  #   scorer: token_set_ratio

  # --- Output ---
  # Each run is stored in its own sub-directory under export_dir.
  # The review section will automatically pick up the most recent run.
  export:
    export_dir: /home/benjaminpillot/Documents/PRO/ABM_LITERATURE_REVIEW/PYSYREV/BIB_RESULTS/
    run_name:   # leave blank for auto-timestamp, or set e.g. "may_2026_wos_oa"


review: # LLM-based review
  #
  # doc_dataset: leave blank to auto-detect the most recent bib run in bib.export.export_dir.
  doc_dataset:
  # Each review run is stored in its own sub-directory under export_dir.
  # Downstream sections (bib_network, topic_model) auto-detect the most recent run.
  export:
    export_dir: /home/benjaminpillot/Documents/PRO/ABM_LITERATURE_REVIEW/PYSYREV/AI_REVIEW_RESULTS/
    run_name:   # leave blank for auto-timestamp, or set e.g. "test_run_1"
    cache_dir:  # leave blank to place inside the run directory
  batch_size : 50
  api_pause : 30  # time.sleep(api_pause) in order to limit nb of API requests per min during reviewing process
  max_retries : 2              # Max retries on API error, for all reviewers. Overridable per reviewer.
  max_concurrent_requests : 10  # Max simultaneous API calls for all reviewers.
                                # Keep low for Anthropic (5-10); null = default (10). 30 is possible for OpenAI.
                                # Overridable per reviewer.
  items_per_call : 20           # Articles sent per API call. Higher values reduce the number of calls
                                # (backstory sent once per batch). Overridable per reviewer.
  text_inputs : [title, abstract, keywords]
#  input_description : article title/abstract/keywords
  inclusion_criteria : The scope of the study MUST include
                       the use or development of agent-based models
                       or agent-based simulations FOR addressing
                       energy transition issues.
  exclusion_criteria : 1. The scope of the study DOES NOT include
                      agent-based modelling or energy transition issues;
                      2. The focus of the study is on multi-agent systems,
                      intelligent agents or software agents for solving
                      specific problems such as control strategies;
                      3. The study belongs to another very distant
                      scientific field, such as geology, zoology,
                      biology, medicine, biomedical studies, etc.
  sample_size : 200  # Leave blank if the whole dataset must be processed. Otherwise,
                    # size of the corresponding random sample to withdraw from the dataset
  decision_rule : majority   # majority, mean
  workflow :    # Workflow consists in as many rounds as defined by the
                # user. Apart the first round, all rounds apply if and only
                # if consensus has not been reached in the previous one
                # (whatever the decision rule selected)
    - round : A
      reviewers : [Reviewer#1, Reviewer#2]  # Reviewer names defined below

    - round : B
      reviewers : [Reviewer#3]

  reviewers :
    - name : Reviewer#1
      reasoning : brief  # brief, cot (see LatteReview)
      model_id : claude-haiku-4-5  # Model identifier
      host :
      provider : anthropic  # values : litellm, open-ai, ollama, anthropic
      max_tokens : 200
      temperature : 0.7  # temperature parameter is not available for all models
      reasoning_effort :
      max_retries :                # Leave blank to use the section-level value above.
      max_concurrent_requests :    # Leave blank to use the section-level value above.
      backstory : Reviewer#1 is a research scientist with strong expertise
                  in Energy System Modelling for addressing issues related
                  to Energy Transition and net-zero scenarios. Reviewer#1
                  specializes in modeling and analyzing complex energy
                  systems, including renewable integration, grid optimization,
                  demand forecasting, energy policy analysis, and
                  techno-economic assessments. A major focus of Reviewer#1 is
                  literature synthesis and literature reviews — it excels at
                  identifying key themes, comparing methodologies, summarizing
                  findings, and highlighting research gaps in energy systems
                  modeling. Reviewer#1 is highly rigorous  and cautious in its
                  analysis of input texts and articles. It performs thorough and
                  contextualized evaluations of abstracts and full papers,
                  ensuring interpretations are grounded in the methodologies,
                  assumptions, and scope presented by the original authors.
                  It avoids oversimplified generalizations and remains critical
                  of speculative claims or poorly substantiated conclusions.
      additional_context :

    - name : Reviewer#2
      reasoning : brief
      model_id : claude-haiku-4-5
      host :
      provider : anthropic
      max_tokens : 200
      temperature : 0.1
      reasoning_effort :
      backstory : Reviewer#2 is a seasoned researcher with a PhD in computer
                  science, specializing in agent-based modeling (ABM) and
                  agent-based simulation techniques. Reviewer#2 helps in
                  designing, analyzing, and troubleshooting complex ABMs,
                  drawing from extensive academic and applied research experience.
                  It can help with model formulation, selection of simulation
                  platforms, parameter tuning, validation techniques, and results
                  interpretation. It also assists with writing and reviewing
                  research papers, grant proposals, and academic presentations
                  involving ABM. Reviewer#2 is collaborative, exploratory, and
                  methodical in its reasoning. It ensures technical accuracy while
                  maintaining a tone that invites discussion, experimentation, and
                  iteration. Reviewer#2 shares relevant methodologies and frameworks
                  but remains open to alternative approaches and creative exploration.
                  It can switch between high-level theoretical discussions and practical
                  coding support. It avoids rigid judgment, encourages open-ended
                  inquiry, and flags assumptions that require clarification or validation.
      additional_context :

    - name : Reviewer#3
      reasoning :
      model_id : claude-sonnet-4-5 # gpt-4o-mini
      host :
      provider : anthropic
      max_tokens : 200
      temperature :
      reasoning_effort : medium
      backstory : Reviewer#3 is a senior MD-PhD researcher with years of experience
                  in conducting systematic reviews in social-ecological systems,
                  Sustainability Science and decarbonisation of the economy. A major
                  focus of Reviewer#3 is literature synthesis and literature reviews —
                  it excels at identifying key themes, comparing methodologies,
                  summarizing findings, and highlighting research gaps in social-ecological
                  studies. Reviewer#3 is highly rigorous and cautious in its analysis of
                  input texts and articles. It performs thorough and contextualized
                  evaluations of abstracts and full papers, ensuring interpretations
                  are grounded in the methodologies, assumptions, and scope presented
                  by the original authors.
      additional_context : Two PhD reviewers have already reviewed this article and
                           disagree on how to evaluate it. You can read their evaluation above.


bib_network:
  doc_dataset:  # leave blank to use the last review run in export_dir

  citation_network:
    use_resolved: true
    use_unresolved: false         # set true to include unresolved external references

  coupling_network:
    use_resolved: true
    use_unresolved: true
    min_shared: 1

  cocitation_network:
    use_resolved: true
    use_unresolved: true
    min_cocitations: 1

  export:
    export_dir: /home/benjaminpillot/Documents/PRO/ABM_LITERATURE_REVIEW/PYSYREV/BIB_NETWORK_RESULTS/
    run_name:   # leave blank for auto-timestamp


topic_model:
  # doc_dataset: leave blank to auto-detect the most recent review run.
  # Set an explicit path to target a specific run or an external CSV.
  doc_dataset:  # ~/Documents/PRO/ABM_LITERATURE_REVIEW/NOTEBOOKS/merged_wos_openalex_with_abstract_no_duplicate.csv
  export:
    export_dir: /home/benjaminpillot/Documents/PRO/ABM_LITERATURE_REVIEW/PYSYREV/TOPIC_MODELING/
    run_name:   # leave blank for auto-timestamp
  # Distance : euclidean, chebyshev ; default = euclidean
  distance: chebyshev

  # ----

  # ---- Coherence scorer -----------------------------
  # Dict of 2 scorers among: c_v, c_npmi, u_mass
  #   * 1st scorer ('ranking') is used to rank the
  #     best configs among all configs (slower part
  #     of the code)
  #   * 2nd one ('purity') is used to compute
  #     purity of the best ranked configurations
  # Recommendation: use the quickest one for ranking,
  # and the slowest one for computing final purity
  # default : {'ranking' : 'u_mass', 'purity' : 'c_v'}
#  coherence_scorer :
#    ranking : u_mass
#    purity : c_v

  # Keep n results : keep N best results among all
  # clustering procedures corresponding to n_neighbors,
  # n_components, topic size, and min sample values
  # default = 10
  keep_n_results :

# ---- HDBSCAN parameters -------------------------
  hdbscan:
    min_topic_size_range : [4, 32]
    min_sample_range : [2, 10]
    topic_size_step : 4
    min_sample_step : 2
#    cluster_selection_method : leaf
#    metric : euclidean
#    prediction_data : True

# ---- UMAP parameters ----------------------------
  umap:
    n_neighbors : [5, 10]
    n_components : [5, 10, 15]
#    metric : cosine
#    min_dist : 0.0
#    low_memory : False
#    random_state : 42

# ---- Bertopic parameters -------------
# Bertopic parameters (see https://maartengr.github.io/BERTopic/index.html)
#  bertopic:
#    transformer_model : allenai/specter2_base
#    n_gram_range : bigram
#    language : english
#    calculate_probabilities : True

# ---- Berteley parameters --------------
# Berteley preprocess (see https://github.com/lbl-camera/berteley)
#  berteley:
#    allow_abbrev : False

# ---- CTF-IDF parameters ----------------
#  ctfidf:
#    bm25_weighting : True
#    reduce_frequent_words : True

# ---- Topic distribution parameters -----
#  topic_distribution:
#    window : 8
#    stride : 1
#    min_similarity : 0.1
#    batch_size : 1000


# =============================================================================
# topic_report — PDF report generation (optional)
# =============================================================================
# When this section is present, `Pipeline.run()` generates a PDF report after
# the topic-model stage. Leave it out to skip report generation entirely.
#
topic_report:
#   # Index in the ranked best_results.csv (0 = best model by distance score).
#   # Open metrics/<distance>_best_results.csv to inspect all ranked models.
#   model_index: 0
#
#   # Directory where the PDF and annex files will be written.
   export_to: /path/to/PYSYREV/REPORT/
#
#   # run_dir: leave blank to auto-detect the latest topic_model run.
#   # run_dir: /path/to/TOPIC_MODELING/run_YYYY-MM-DD_HH-MM-SS/


# =============================================================================
# llm — LLM topic labelling (optional)
# =============================================================================
# When present, an LLM generates a human-readable label for each topic.
# Remove or comment out this block to skip LLM labelling.
#
llm:
   provider:   anthropic
   model_id:   claude-haiku-4-5-20251001
   host:
   max_tokens: 200
   temperature: 0.3
   n_repr_docs_for_labeling: 10


