[hdbscan]
cluster_selection_method = leaf
metric = euclidean
min_topic_size_range = 20, 60
min_sample_range = 2, 10
topic_size_step = 4
min_sample_step = 2

[umap]
metric = cosine
min_dist = 0.0
n_neighbors = 5, 10
n_components = 5, 10, 15

# Bertopic parameters
[bertopic]
transformer_model = allenai/specter2_base
n_gram_range = bigram
language = english
nr_repr_docs = 50

# Berteley preprocess
[berteley]
allow_abbrev = False

[ctfidf]
bm25_weighting = True
reduce_frequent_words = True

[topic_distribution]
window = 8
stride = 1
similarity = 0.1
batch_size = 1000



