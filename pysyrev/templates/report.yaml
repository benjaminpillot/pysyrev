# config_report.yaml
# ─────────────────────────────────────────────────────────────────────────────
# Phase 2 config: select a topic model result and produce a PDF report.
#
# Two independent sections:
#   topic_report  — which run and which model to use
#   report        — PDF layout (metadata, optional extra sections)
#
# Usage:
#   from pysyrev.core.config import TopicReportFileConfig
#   from pysyrev.topic_report import TopicReport
#
#   cfg    = TopicReportFileConfig.load("config_report.yaml")
#   report = TopicReport.from_config(cfg)
#   report.generate_report()
# ─────────────────────────────────────────────────────────────────────────────

# Path to the main pysyrev config file.
# Used to auto-detect the latest topic_model run when topic_report.run_dir is blank,
# and the latest bib_network run when bib_network paths are blank.
config: /path/to/config.yaml

topic_report:
  # Specific run to use. Leave blank to auto-detect the latest run via 'config' above.
  # run_dir: /path/to/TOPIC_MODELING/run_YYYY-MM-DD_HH-MM-SS/

  # Index in the ranked best_results.csv (0 = best model by distance).
  # Open metrics/<distance>_best_results.csv to inspect and choose.
  model_index: 0

  # Directory where the PDF will be written.
  export_to:   /path/to/PYSYREV/REPORT/


# ---- Bibliographic networks (optional) ------------------------------------
# Paths to the GraphML files produced by the bib_network stage.
# Leave both blank to auto-detect from bib_network.export.export_dir in the
# main config pointed to by 'config' above.
#
# bib_network:
#   coupling_graph:   /path/to/bib_network_results/run_xxx/coupling_network.graphml
#   cocitation_graph: /path/to/bib_network_results/run_xxx/cocitation_network.graphml


# ---- LLM topic labeling (optional) ----------------------------------------
# When present, the LLM generates a human-readable label for each topic from
# its representative keywords and representative document titles/abstracts.
# Remove or comment out this block to skip LLM labeling.
#
# llm:
#   provider:   anthropic             # anthropic | openai | ollama | litellm
#   model_id:   claude-haiku-4-5-20251001
#   host:                             # optional — leave blank for cloud APIs
#   max_tokens: 200
#   temperature: 0.3
#   nr_repr_docs: 3                   # how many representative docs to include per topic
#   # max_retries: 2
#   # max_concurrent_requests: 5
#   # system_prompt:                  # override the default system prompt


report:
  meta:
    title:       Bibliographic report — Pysyrev
    subtitle:    # optional
    author:      Report generated with the pysyrev engine (v0.1)
    date_format: "%d/%m/%Y"
    version:     1.0.0
    summary: >
      This document has been automatically generated and emphasises the main
      features of the literature review performed through a mixture of
      BERTopic, Berteley and LLM-based reviewing (LatteReview).

  # Optional extra sections appended after the auto-generated ones.
  # Each section follows the declarative block format of the PDF engine
  # (see pysyrev/core/report2.py for supported block types).
  sections:
  #  - title: "Appendix — Notes"
  #    blocks:
  #      - type: paragraph
  #        text: "Add your custom notes here."
