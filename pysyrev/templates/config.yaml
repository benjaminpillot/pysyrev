# =============================================================================
# pysyrev — pipeline configuration template
# =============================================================================
# Copy this file, fill in the required fields, and uncomment the optional
# sections you need.  Default values are shown next to commented-out keys.
#
# All sections are optional — only the sections present are executed.
# The canonical stage order is:
#   bib → review → topic-model → topic-report
#
# Sections:
#   bib          — bibliography collection and preparation
#   review       — LLM-based title/abstract screening
#   topic_model  — BERTopic-based topic modelling
#   topic_report — PDF report generation (model selection); the coupling and
#                  co-citation network panels are computed here from the reviewed
#                  dataset (see topic_report.sections.bib_network)
#   llm          — LLM topic labelling (optional, used with topic_report)
#   report       — PDF layout and section parameters
#
# Usage:
#   from pysyrev.core.config import Config
#   config = Config.load("my_config.yaml")
#
#   # Run all configured stages:
#   from pysyrev import Pipeline
#   Pipeline.from_config("my_config.yaml").run()
# =============================================================================

# Optional: path to a .env file.  Any ${VAR} reference in this file is
# resolved against it at load time.
# env: /path/to/.env


# =============================================================================
# bib
# =============================================================================
bib:

  # ---- Sources (include at least one) ------------------------------------
  # Set source: to 'file' or 'api'.  Leave the block blank / remove it to
  # skip that source.

  wos:
    source: file                    # 'file' | 'api'
    file: /path/to/savedrecs.bib    # file path or directory of .bib files (WoS exports by chunks)
    # api:                          # required when source: api
    #   api_key: ${WOS_API_KEY}
    #   query: 'ALL=(your query) AND PY=2015-2024'
    #   cache_dir: /path/to/wos_cache/   # omit to disable caching

  open_alex:
    source: file                    # 'file' | 'api'
    file: /path/to/open_alex.csv    # required when source: file
    # api:                          # required when source: api
    #   api_key: ${OPENALEX_API_KEY}
    #   email: ${OPENALEX_EMAIL}         # optional — enables the polite pool
    #   query: your search terms         # free-text BM25 on title + abstract
    #   filters:                         # structured filters (combined with AND)
    #     publication_year: '2015-2024'
    #     type: article
    #   cache_dir: /path/to/oa_cache/
    # ---- Abstract completion (opt-in) --------------------------------------
    # OpenAlex has no abstract for a share of its records. Add this block to
    # recover those abstracts from Web of Science (looked up by DOI) before
    # no-abstract rows are dropped. Its presence enables completion; omit it to
    # skip. Only the abstract is filled — the OpenAlex referenced_works IDs used
    # for coupling networks are left intact. Requires a WoS Expanded API key.
    # Further completion providers (e.g. scopus_completion) can be added here
    # later the same way.
    # wos_completion:
    #   api_key: ${WOS_API_KEY}
    #   cache_dir: /path/to/wos_completion_cache/   # omit to disable caching

  # scopus:
  # pubmed:

  # ---- Duplicate removal across sources (defaults shown) -----------------
  # merge:
  #   title_similarity: 98         # fuzzy threshold (0-100)
  #   ngram_size: 3
  #   max_candidates_per_row: 200
  #   scorer: token_set_ratio      # token_set_ratio | partial_token_sort_ratio | WRatio | ...
  #   # Deduplication priority, most-important source first. The first configured
  #   # source wins duplicates and keeps its IDs; dropped duplicates are aliased so
  #   # references still resolve. Default keeps OpenAlex first (stable IDs, abstracts
  #   # completed from WoS). List wos first to restore the old WoS-wins behaviour.
  #   priority: [open_alex, wos, scopus, pubmed]

  # ---- Abstract cleaning (defaults shown) --------------------------------
  # clean:
  #   min_signals_to_reject: 2     # garbage signals needed to drop an abstract
  #   extra_garbage_phrases: []
  #   use_langdetect: false

  # ---- Document filtering ------------------------------------------------
  extract:
    # include_doc_type: [article, review]  # blank = keep all document types
    # exclude_doc_type: [peer review]      # types to remove (fuzzy); takes priority over include_doc_type
    year: 2000                     # min publication year (inclusive)
    language: english              # str, list of str, or blank (keep all)
    # nb_citations: 0              # min citation count (inclusive)
    # scorer: partial_token_sort_ratio
    # score_cutoff: 90

  # ---- Reference resolution (opt-in, expensive) --------------------------
  # resolve_references:
  #   enabled: true
  #   flag_unresolved: true
  #   fuzzy_score_cutoff: 90
  #   ngram_size: 3
  #   max_candidates: 50
  #   scorer: token_set_ratio

  # ---- Output ------------------------------------------------------------
  # Each run is stored in its own sub-directory: <export_dir>/<run_name>/.
  # Leave run_name blank to auto-generate a timestamp (YYYY-MM-DDTHHMMSS).
  # The review section will automatically pick up the most recent run.
  export:
    export_dir: /path/to/output/bib_results/
    run_name:               # blank → auto-timestamp; or e.g. "may_2026_wos_oa"


# =============================================================================
# review
# =============================================================================
review:

  # ---- Input -------------------------------------------------------------
  # Leave blank to auto-detect the most recent bib run in bib.export.export_dir.
  # Set an explicit path to use a specific bib CSV.
  doc_dataset:

  # ---- Output ------------------------------------------------------------
  # Each run is stored in its own sub-directory: <export_dir>/<run_name>/.
  # Leave run_name blank to auto-generate a timestamp (YYYY-MM-DDTHHMMSS) so
  # successive runs never overwrite each other.
  # The topic_model section auto-detects the most recent run (its dataset also
  # feeds the report's network panels).
  export:
    export_dir: /path/to/output/review_results/
    run_name:               # blank → auto-timestamp; or e.g. "pilot_run_1"
    cache_dir:              # blank → <export_dir>/<run_name>/cache/

  # ---- Execution parameters ----------------------------------------------
  # batch_size: 100               # articles processed per checkpoint batch
  # api_pause: 30.0               # seconds between batches (rate-limit guard)
  # max_retries: 2                # on API error; overridable per reviewer
  # max_concurrent_requests: 5    # keep 5-10 for Anthropic, up to 30 for OpenAI
  # items_per_call: 5             # articles per API call (backstory sent once)

  # ---- Input -------------------------------------------------------------
  text_inputs: [title, abstract, keywords]
  # sample_size:                  # default: null (process full dataset); integer = random sample size

  # ---- Screening criteria ------------------------------------------------
  inclusion_criteria: |
    <Describe what MUST be true for a document to be included.>

  exclusion_criteria: |
    1. <First reason to exclude a document.>
    2. <Second reason to exclude a document.>

  # ---- Decision logic ----------------------------------------------------
  # decision_rule: majority       # default: majority  (majority | mean)

  # ---- Workflow ----------------------------------------------------------
  # Rounds are executed in order.  Round N+1 only runs on documents where
  # round N produced no consensus.
  workflow:
    - round: A
      reviewers: [Reviewer1, Reviewer2]

    # - round: B                  # optional tie-breaker round
    #   reviewers: [Reviewer3]

  # ---- Reviewer definitions ----------------------------------------------
  reviewers:
    - name: Reviewer1
      provider: anthropic         # anthropic | openai | litellm | ollama
      model_id: claude-haiku-4-5
      reasoning: brief            # brief | cot
      max_tokens: 200
      temperature: 0.7
      host:                       # custom endpoint (litellm / ollama); blank for hosted APIs
      reasoning_effort:           # low | medium | high (extended-thinking models only)
      max_retries:                # blank → section-level value
      max_concurrent_requests:    # blank → section-level value
      items_per_call:             # blank → section-level value
      backstory: |
        <Describe Reviewer1's domain expertise, role, and reviewing style.>
      additional_context:         # extra context injected at the end of each prompt

    - name: Reviewer2
      provider: anthropic
      model_id: claude-haiku-4-5
      reasoning: brief
      max_tokens: 200
      temperature: 0.1
      host:
      reasoning_effort:
      max_retries:
      max_concurrent_requests:
      items_per_call:
      backstory: |
        <Describe Reviewer2's domain expertise, role, and reviewing style.>
      additional_context:

    # Uncomment to add a tie-breaker reviewer (used in round B above).
    # - name: Reviewer3
    #   provider: anthropic
    #   model_id: claude-sonnet-4-5
    #   reasoning:
    #   max_tokens: 200
    #   temperature:
    #   host:
    #   reasoning_effort: medium
    #   max_retries:
    #   max_concurrent_requests:
    #   items_per_call:
    #   backstory: |
    #     <Describe Reviewer3's expertise.>
    #   additional_context: |
    #     <Context specific to this reviewer, e.g. previous reviewers' verdicts.>


# =============================================================================
# topic_model
# =============================================================================
topic_model:

  # Input CSV (reviewed_included.csv produced by the review stage).
  # Leave blank to auto-detect the most recent review run.
  # Set an explicit path to target a specific run or an external file.
  doc_dataset:

  export:
    export_dir: /path/to/output/topic_modeling/
    run_name:                     # blank → auto-timestamp

  # ---- Distance metric used to rank configurations -----------------------
  distance: euclidean             # euclidean | chebyshev

  # ---- Number of best configurations to keep -----------------------------
  keep_n_results: 10
  best_model_index: 0      # index in best_results.csv (0 = best ranked model)

  # ---- Coherence scorers (defaults shown) --------------------------------
  # coherence_scorer:
  #   ranking: u_mass             # ranks all configurations (fast)
  #   purity: c_v                 # scores the best configurations (slower)

  # ---- HDBSCAN clustering ------------------------------------------------
  hdbscan:
    min_topic_size_range: [10, 50]    # [min, max] grid-search bounds
    min_sample_range: [2, 10]
    topic_size_step: 4
    min_sample_step: 2
    # cluster_selection_method: leaf
    # metric: euclidean
    # prediction_data: true

  # ---- UMAP dimensionality reduction -------------------------------------
  umap:
    n_neighbors: [5, 10]              # grid-search values
    n_components: [5, 10, 15]
    # metric: cosine
    # min_dist: 0.0
    # low_memory: false
    # random_state: 42

  # ---- BERTopic model (defaults shown) -----------------------------------
  # bertopic:
  #   transformer_model: allenai/specter2_base
  #   n_gram_range: bigram            # unigram | bigram
  #   language: english
  #   calculate_probabilities: true

  # ---- Berteley pre-processing (defaults shown) --------------------------
  # berteley:
  #   allow_abbrev: false

  # ---- c-TF-IDF weighting (defaults shown) -------------------------------
  # ctfidf:
  #   bm25_weighting: true
  #   reduce_frequent_words: true

  # ---- Topic distribution approximation (defaults shown) -----------------
  # topic_distribution:
  #   window: 8
  #   stride: 1
  #   min_similarity: 0.1
  #   batch_size: 1000


# =============================================================================
# topic_report  (optional)
# =============================================================================
# When present, a PDF report is generated after the topic-model stage.
# Remove this section entirely to skip report generation.
#
# topic_report:
#   export_to: /path/to/output/report/
#   # run_dir:              # blank → auto-detect the latest topic_model run
#
#   # ---- PDF metadata (defaults shown) -------------------------------------
#   # meta4 rue du puits vieux 34110 Vic la Gardiole:
#   #   title: Bibliographic report — Pysyrev
#   #   subtitle:
#   #   author: Report generated with the pysyrev engine (v0.1)
#   #   date_format: "%d/%m/%Y"
#   #   version: 1.0.0
#   #   summary: >
#   #     This document has been automatically generated.
#
#   # ---- Section parameters (defaults shown) --------------------------------
#   # sections:
#   #   topics:
#   #     n_repr_docs_per_topic: 5   # representative documents shown per topic
#   #   bib_network:                # coupling + co-citation + connectivity panels
#   #     coupling:                 # document × document (Salton + Leiden, coloured by topic)
#   #       resolution: 0.7         # Leiden resolution; higher → more, smaller communities (default: 0.7)
#   #       min_size: 5             # communities smaller than this fall into the uncoupled tail (default: 5)
#   #       backbone_k: 3           # draw only each node's k strongest couplings (default: 3)
#   #       color_by: topic         # topic | community (default: topic)
#   #       hulls: true             # outline Leiden communities when colouring by topic (default: true)
#   #     cocitation:               # reference × reference (Salton + Leiden)
#   #       min_ref_freq: 2         # keep references cited by at least this many documents (default: 2)
#   #       resolution: 0.7         # Leiden resolution (default: 0.7)
#   #       min_size: 5             # communities smaller than this fall into the tail (default: 5)
#   #       backbone_k: 3           # draw only each node's k strongest co-citations (default: 3)
#   #       color_by: community     # topic | community (default: community)
#   #       hulls: true             # outline Leiden communities when colouring by topic (default: true)
#   #     connectivity:             # mean coupling between groups
#   #       by: topic               # topic | community — group the coupling nodes by this (default: topic)
#   #       scale: 1000             # rescales the tiny coupling values for readability (default: 1000)
#   #   temporal:
#   #     variants: [absolute, normalized, weighted]
#   #   topic_characteristics:
#   #     n_top_cited_per_topic: 5   # N most-cited papers per topic used for citation impact
#   #     n_top_cited_global: 50     # N most-cited papers globally used for topic distribution
#   #   topic_similarity:
#   #     clustering: true          # reorder heatmap by hierarchical clustering
#   #     dendrogram: true
#   #   paper_selection:
#   #     min_year: 2020
#   #     proportion_per_topic: 0.15
#   #     selection_by: citations          # citations | random | coupling | co_citation | composite
#   #     # composite = three-axis indicator (coupling centrality + citation
#   #     # relevance + thematic representativeness), ranked per topic. Tune it here:
#   #     composite:
#   #       aggregate: mean          # mean | gmean | chebyshev
#   #       weights: [1, 1, 1]       # (centrality, representativeness, relevance); omit for equal
#   #       relevance_mode: blend    # blend (cit/yr + raw citations) | cpy (cit/yr alone)
#   #       drop_current_year: true  # drop the incomplete current year from the cit/yr denominator
#   #       current_year:            # reference year; blank = latest year in the corpus
#   #     export_annex: true
#   #     annex_format: csv         # csv | txt


# =============================================================================
# llm  (optional — used with topic_report)
# =============================================================================
# When present, an LLM generates human-readable labels for each topic.
# Remove this section to skip LLM labelling.
#
# llm:
#   provider: anthropic       # anthropic | openai | litellm | ollama
#   model_id: claude-haiku-4-5-20251001
#   host:                     # blank for hosted APIs
#   max_tokens: 200
#   temperature: 0.3
#   n_repr_docs_for_labeling: 3   # representative documents per topic sent to the LLM to generate topic labels
#   # max_retries: 2
#   # max_concurrent_requests: 5
#   # system_prompt:          # override the default system prompt
