name: tests

on:
  push:
    branches: [master, main, development]
  pull_request:
    branches: [master, main, development]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install numpy              # must precede gensim to avoid build failure
          pip install pytest
          pip install -e .   # plotly + kaleido are install_requires now

      - name: Run tests (fast, no ML stack)
        run: pytest -m "not slow and not integration" -q
